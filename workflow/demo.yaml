# 最小可跑示例：验证「串行执行 + 数据传递 + load/unload + KB 挂载 + api 类型」
#
#   python main.py run --workflow workflow/demo.yaml --input "西瓜，夏天解暑" -v
#
workflow_id: demo_001

nodes:
  # 1) 本地模型节点，挂一个知识库分区（检索结果会写入 payload["kb_result"]）
  - node_id: step_1
    type: llm
    plugin_name: llm_dummy
    kb_plugin_name: kb_dummy
    kb_collection: ads_lib
    params: {}

  # 2) 工具节点：无显存操作，只实现 run()
  - node_id: step_2
    type: skill
    plugin_name: skill_print_payload
    params: {}

  # 3) 远程 API 节点：与 llm 同生命周期，但 load/unload 为空操作
  - node_id: step_3
    type: api
    plugin_name: api_dummy
    params:
      model: "gpt-demo"
